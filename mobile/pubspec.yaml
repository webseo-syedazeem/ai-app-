name: ai_daily_helper
description: "Your AI that remembers. Personal daily-life assistant built with Flutter, Gemini AI, and Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
